name: Verificar acesso Supabase

on:
  push:
    branches: [codex/kiwify-pro-preparation]
    paths: [.github/workflows/supabase-access-check.yml]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir escopo do token para o projeto
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo 'SUPABASE_ACCESS_TOKEN não foi cadastrado no repositório'
            exit 1
          fi
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            'https://api.supabase.com/v1/projects/olisgsnjtrrhldrbtxbl')
          if [ "$status" != '200' ]; then
            echo "Acesso ao projeto Supabase falhou (HTTP $status)"
            exit 1
          fi
          echo 'Token reconhecido e acesso de leitura ao projeto confirmado'
